<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý bệnh nhân</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header"><h1>Quản lý bệnh nhân</h1><p>Thêm bệnh nhân mới và xem danh sách bệnh nhân</p></div>
  <div class="navbar">
    <a href="index.html">Trang chủ</a><a href="benhnhan.html">Bệnh nhân</a><a href="bacsi.html">Bác sĩ</a>
    <a href="lichhen.html">Lịch hẹn</a><a href="phieukham.html">Phiếu khám</a><a href="baocao.html">Báo cáo</a>
  </div>
  <div class="container">
    <div class="card">
      <h2>Thêm bệnh nhân</h2>
      <form id="benhNhanForm" class="form-grid">
        <input name="MaBN" placeholder="Mã bệnh nhân, ví dụ BN011" maxlength="5" required>
        <input name="HoTen" placeholder="Họ tên" required>
        <input name="NgaySinh" type="date">
        <select name="GioiTinh"><option value="Nam">Nam</option><option value="Nữ">Nữ</option><option value="Khác">Khác</option></select>
        <input name="DiaChi" placeholder="Địa chỉ">
        <input name="SoDienThoai" placeholder="Số điện thoại">
        <select name="NhomMau"><option value="">-- Nhóm máu --</option><option value="A">A</option><option value="B">B</option><option value="AB">AB</option><option value="O">O</option></select>
        <input name="TienSuBenh" placeholder="Tiền sử bệnh">
        <button type="submit">Thêm bệnh nhân</button>
      </form>
      <div id="message" class="message"></div>
    </div>
    <div class="card">
      <h2>Danh sách bệnh nhân</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mã BN</th><th>Họ tên</th><th>Ngày sinh</th><th>Giới tính</th><th>Địa chỉ</th><th>SĐT</th><th>Nhóm máu</th><th>Tiền sử bệnh</th></tr></thead>
          <tbody id="benhNhanTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    const form = document.getElementById("benhNhanForm");
    const tableBody = document.getElementById("benhNhanTable");
    async function loadBenhNhan() {
      try {
        const data = await fetchJSON("/api/benhnhan");
        tableBody.innerHTML = "";
        data.forEach(bn => {
          tableBody.innerHTML += `<tr>
            <td>${bn.MaBN}</td><td>${bn.HoTen}</td><td>${formatDate(bn.NgaySinh)}</td><td>${bn.GioiTinh || ""}</td>
            <td>${bn.DiaChi || ""}</td><td>${bn.SoDienThoai || ""}</td><td>${bn.NhomMau || ""}</td><td>${bn.TienSuBenh || ""}</td>
          </tr>`;
        });
      } catch (err) { showMessage("message", err.message, false); }
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const result = await fetchJSON("/api/benhnhan", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(getFormData(form))
        });
        showMessage("message", result.message, true);
        form.reset(); loadBenhNhan();
      } catch (err) { showMessage("message", err.message, false); }
    });
    loadBenhNhan();
  </script>
</body>
</html>
